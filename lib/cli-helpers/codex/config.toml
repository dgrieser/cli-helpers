personality = "pragmatic"
web_search = "cached"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[tui]
screen_reader_detection_done = true
session_picker_view = "comfortable"
status_line = ["model-with-reasoning", "current-dir", "thread-name", "git-branch", "approval-mode", "context-used", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true
terminal_title = ["project-name", "git-branch", "thread-name", "activity"]
theme = "coldark-dark"
auto_recap = false
copy_on_select = "auto"

[tui.keymap.composer]
queue = []
submit = "enter"

[tui.presets.1]
input = "/model @CODEX_REVIEW_MODEL@ --speed=standard"
label = ""

[tui.presets.2]
input = "/model @CODEX_REVIEW_DEEP_MODEL@ --speed=standard"
label = ""

[tui.effects]
starfield = false

[features]
hooks = true

[plugins."github@openai-curated"]
enabled = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[hooks.state]

[hooks.state."@HOME@/.codex/hooks.json:session_start:0:0"]
trusted_hash = "sha256:0ed786805542f7114c30eda6945e72a2f1285c06fd6d4320de621a9549c095ed"
enabled = true

