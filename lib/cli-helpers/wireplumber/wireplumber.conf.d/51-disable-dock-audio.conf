# Disable the audio of the ThinkPad USB-C dock and of the Aukey webcam microphone,
# both never used. Disabling stops WirePlumber from monitoring their hotplug, which
# spun at 100% CPU on stale ALSA control FDs when (un)docking.

monitor.alsa.rules = [
  {
    # Lenovo ThinkPad USB-C Dock audio
    matches = [
      { api.alsa.card.name = "ThinkPad USB-C Dock Audio" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    # Aukey-PC-LM1E Camera USB microphone
    matches = [
      { api.alsa.card.name = "Aukey-PC-LM1E Camera" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
