# Disable the HDMI/DisplayPort audio of an AMD GPU, never used; updater installs this
# only on a laptop that has one.

monitor.alsa.rules = [
  {
    # HDMI / DisplayPort audio on the AMD GPU (card "Generic", pci .1 function)
    matches = [
      { device.product.name = "Radeon High Definition Audio Controller" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
