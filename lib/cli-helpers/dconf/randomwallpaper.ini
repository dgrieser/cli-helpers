# Random Wallpaper: every 23:59 hours one new image for desktop and lock screen from
# the folder Wallpaper/Space, no panel icon; the other sources are kept but disabled.
# Loaded by updater randomwallpaper, @PICTURES@ is the user's pictures folder.

[org/gnome/shell/extensions/space-iflow-randomwallpaper]
auto-fetch=true
change-type=2
hide-panel-icon=true
hours=23
minutes=59
sources=['1750285592378', '1750286384388', '1750286460885', '1763451671454', '1782887314546']

[org/gnome/shell/extensions/space-iflow-randomwallpaper/sources/general/1750285592378]
enabled=false
name='wallhaven'
type=1

[org/gnome/shell/extensions/space-iflow-randomwallpaper/sources/general/1750286384388]
enabled=false
name='Bing'
type=3

[org/gnome/shell/extensions/space-iflow-randomwallpaper/sources/general/1750286460885]
enabled=false
name='Google Earth View'
type=3

[org/gnome/shell/extensions/space-iflow-randomwallpaper/sources/general/1763451671454]
enabled=false
name='Jellyfish'
type=4

[org/gnome/shell/extensions/space-iflow-randomwallpaper/sources/general/1782887314546]
name='Space'
type=4

[org/gnome/shell/extensions/space-iflow-randomwallpaper/sources/genericJSON/1750286384388]
domain='https://bing.com'
image-path='$.images[@random].url'
image-prefix='https://bing.com'
request-url='http://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=15&mkt=de_DE'

[org/gnome/shell/extensions/space-iflow-randomwallpaper/sources/genericJSON/1750286460885]
image-path='$[@random].image'
request-url='https://raw.githubusercontent.com/limhenry/earthview/master/earthview.json'

[org/gnome/shell/extensions/space-iflow-randomwallpaper/sources/localFolder/1763451671454]
folder='@PICTURES@/Wallpaper/Jellyfish'

[org/gnome/shell/extensions/space-iflow-randomwallpaper/sources/localFolder/1782887314546]
folder='@PICTURES@/Wallpaper/Space'

[org/gnome/shell/extensions/space-iflow-randomwallpaper/sources/unsplash/1750285592378]
content-filter='high'
orientation='landscape'

[org/gnome/shell/extensions/space-iflow-randomwallpaper/sources/wallhaven/1750285592378]
ai-art=true
keyword='nature'
